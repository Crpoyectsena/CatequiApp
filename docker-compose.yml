services:
  catequi-db:
    image: mysql:8.0
    container_name: catequi_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    ports:
      - "3355:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - catequi-db-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: catequi-db-rdbms
    environment:
      PMA_HOST: catequi-db
    ports:
      - "8080:80"
    depends_on:
      catequi-db:
        condition: service_healthy
    networks:
      - catequi-db-network

volumes:
  db_data:

networks:
  catequi-db-network:
    driver: bridge
